{% extends "console/base.html" %}
{% load static %}
{% block title %}Sign in{% endblock %}
{% block auth %}
<div class="card">
  <img class="mark mark-img" src="{% static 'sqsy/civil.png' %}" alt="Civil">
  <h1>Civil</h1>
  <p class="muted">One account for every SQSY app.</p>
  <form method="post">
    {% csrf_token %}
    <div class="field"><label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus autocomplete="username" required></div>
    <div class="field"><label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    {% if form.errors %}<ul class="errorlist"><li>Wrong username or password.</li></ul>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
