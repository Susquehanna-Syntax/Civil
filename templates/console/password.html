{% extends "console/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1><p>This is the password for every app you sign in to with Civil.</p></div></div>
<form method="post" class="card" style="max-width:520px">
  {% csrf_token %}
  {% for f in form %}{% include "console/_field.html" %}{% endfor %}
  <div class="actions"><a class="btn" href="{% url 'home' %}">Cancel</a><button class="btn primary" type="submit">Change password</button></div>
</form>
{% endblock %}
